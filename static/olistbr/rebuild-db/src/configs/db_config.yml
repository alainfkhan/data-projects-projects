# what i want the tables to look like
# can be generated
# keep spaces: 2
olist_stg:

- sales:

  - dim_customers:
      filename: olist_customers_dataset.csv
      type: dim
      columns:
      - customer_id:
          dtype: CHAR(32)
          nullable: false
      - customer_unique_id:
          dtype: CHAR(32)
          nullable: false
      - customer_zip_code_prefix:
          dtype: CHAR(5)
          nullable: false
      - customer_city:
          dtype: VARCHAR(50)
          nullable: true
      - customer_state:
          dtype: CHAR(2)
          nullable: true
      constraints:
      - pk_dim_customers:
          type: PRIMARY KEY
          columns:
          - customer_id

  - dim_sellers:
      filename: olist_sellers_dataset.csv
      type: dim
      columns:
      - seller_id:
          dtype: CHAR(32)
          nullable: false
      - seller_zip_code_prefix:
          dtype: CHAR(5)
          nullable: false
      - seller_city:
          dtype: NVARCHAR(50)
          nullable: false
      - seller_state:
          dtype: CHAR(2)
          nullable: false
      constraints:
      - pk_dim_sellers:
          type: PRIMARY KEY
          columns:
          - seller_id

  - dim_product_category_name_translation:
      filename: product_category_name_translation.csv
      type: dim
      columns:
      - product_category_name:
          dtype: VARCHAR(50)
          nullable: false
      - product_category_name_english:
          dtype: VARCHAR(50)
          nullable: false
      constraints:
      - pk_dim_product_category_name_translation:
          type: PRIMARY KEY
          columns:
          - product_category_name

  - dim_products:
      filename: olist_products_dataset.csv
      type: dim
      columns:
      - product_id:
          dtype: CHAR(32)
          nullable: false
      - product_category_name:
          dtype: VARCHAR(50)
          nullable: true
      - product_name_lenght:
          dtype: TINYINT
          nullable: true
      - product_description_lenght:
          dtype: SMALLINT
          nullable: true
      - product_photos_qty:
          dtype: TINYINT
          nullable: true
      - product_weight_g:
          dtype: INT
          nullable: true
      - product_length_cm:
          dtype: TINYINT
          nullable: true
      - product_height_cm:
          dtype: TINYINT
          nullable: true
      - product_width_cm:
          dtype: TINYINT
          nullable: true
      constraints:
      - pk_dim_products:
          type: PRIMARY KEY
          columns:
          - product_id
      # - fk_dim_products_dim_product_category_name_translation__product_category_name:
      #     type: FOREIGN KEY
      #     column: product_category_name
      #     references:
      #       dim_product_category_name_translation:
      #         schema: sales
      #         column: product_category_name

  - fact_orders:
      filename: olist_orders_dataset.csv
      type: fact
      columns:
      - order_id:
          dtype: CHAR(32)
          nullable: false
      - customer_id:
          dtype: CHAR(32)
          nullable: false
      - order_status:
          dtype: VARCHAR(20)
          nullable: false
      - order_purchase_timestamp:
          dtype: DATETIME2
          nullable: false
      - order_approved_at:
          dtype: DATETIME2
          nullable: true
      - order_delivered_carrier_date:
          dtype: DATETIME2
          nullable: true
      - order_delivered_customer_date:
          dtype: DATETIME2
          nullable: true
      - order_estimated_delivery_date:
          dtype: DATETIME2
          nullable: true
      constraints:
      - pk_fact_orders:
          type: PRIMARY KEY
          columns:
          - order_id
      - fk_fact_orders_dim_customers__customer_id:
          type: FOREIGN KEY
          column: customer_id
          references:
            dim_customers:
              schema: sales
              column: customer_id

  - fact_order_items:
      filename: olist_order_items_dataset.csv
      type: fact
      columns:
      - order_id:
          dtype: CHAR(32)
          nullable: false
      - order_item_id:
          dtype: TINYINT
          nullable: false
      - product_id:
          dtype: CHAR(32)
          nullable: false
      - seller_id:
          dtype: CHAR(32)
          nullable: false
      - shipping_limit_date:
          dtype: DATETIME2
          nullable: false
      - price:
          dtype: DECIMAL(9, 4)
          nullable: false
      - freight_value:
          dtype: DECIMAL(9, 4)
          nullable: false
      constraints:
      - pk_fact_order_items:
          type: PRIMARY KEY
          columns:
          - order_id
          - order_item_id
      - fk_fact_order_items_fact_orders__order_id:
          type: FOREIGN KEY
          column: order_id
          references:
            fact_orders:
              schema: sales
              column: order_id
      - fk_fact_order_items_dim_products__product_id:
          type: FOREIGN KEY
          column: product_id
          references:
            dim_products:
              schema: sales
              column: product_id
      - fk_fact_order_items_dim_sellers__seller_id:
          type: FOREIGN KEY
          column: seller_id
          references:
            dim_sellers:
              schema: sales
              column: seller_id

  - fact_order_payments:
      filename: olist_order_payments_dataset.csv
      type: fact
      columns:
      - order_id:
          dtype: CHAR(32)
          nullable: false
      - payment_sequential:
          dtype: TINYINT
          nullable: false
      - payment_type:
          dtype: VARCHAR(20)
          nullable: false
      - payment_installments:
          dtype: TINYINT
          nullable: false
      - payment_value:
          dtype: DECIMAL(9, 4)
          nullable: false
      constraints:
      - pk_fact_order_payments:
          type: PRIMARY KEY
          columns:
          - order_id
          - payment_sequential
      # - fk_fact_order_payments_fact_orders__order_id:
      #     type: FOREIGN KEY
      #     column: order_id
      #     references:
      #       fact_orders:
      #         schema: sales
      #         column: order_id

  - fact_order_reviews:
      filename: olist_order_reviews_dataset.csv
      type: fact
      columns:
      - review_id:
          dtype: CHAR(32)
          nullable: false
      - order_id:
          dtype: CHAR(32)
          nullable: false
      - review_score:
          dtype: TINYINT
          nullable: false
      - reiew_comment_title:
          dtype: NVARCHAR(30)
          nullable: true
      - reiew_comment_message:
          dtype: NVARCHAR(210)
          nullable: true
      - reiew_creation_date:
          dtype: DATETIME2
          nullable: false
      - reiew_answer_timestamp:
          dtype: DATETIME2
          nullable: false
      constraints:
      - pk_fact_order_reviews:
          type: PRIMARY KEY
          columns:
          - review_id
          - order_id
      # - fk_fact_order_reviews_fact_orders__order_id:
      #     type: FOREIGN KEY
      #     column: order_id
      #     references:
      #       fact_orders:
      #         schema: sales
      #         column: order_id
      - chk_review_score:
          type: CHECK
          column: review_score
          expression: 'BETWEEN 1 AND 5'

- marketing:

  - fact_marketing_qualified_leads:
      filename: olist_marketing_qualified_leads_dataset.csv
      type: fact
      columns:
      - mql_id:
          dtype: CHAR(32)
          nullable: false
      - first_contact_date:
          dtype: DATE
          nullable: false
      - landing_page_id:
          dtype: CHAR(32)
          nullable: false
      - origin:
          dtype: VARCHAR(20)
          nullable: true
      constraints:
      - pk_fact_marketing_qualified_leads:
          type: PRIMARY KEY
          columns:
          - mql_id

  - fact_closed_deals:
      filename: olist_closed_deals_dataset.csv
      type: fact
      columns:
      - mql_id:
          dtype: CHAR(32)
          nullable: false
      - seller_id:
          dtype: CHAR(32)
          nullable: false
      - sdr_id:
          dtype: CHAR(32)
          nullable: false
      - sr_id:
          dtype: CHAR(32)
          nullable: false
      - won_date:
          dtype: DATETIME2
          nullable: false
      - business_segment:
          dtype: VARCHAR(40)
          nullable: true
      - lead_type:
          dtype: VARCHAR(20)
          nullable: true
      - lead_behaviour_profile:
          dtype: VARCHAR(20)
          nullable: true
      - has_company:
          dtype: BIT
          nullable: true
      - has_gtin:
          dtype: BIT
          nullable: true
      - average_stock:
          dtype: VARCHAR(10)
          nullable: true
      - business_type:
          dtype: VARCHAR(20)
          nullable: true
      - declared_product_catalog_size:
          dtype: DECIMAL(9, 4)
          nullable: true
      - declared_monthly_revenue:
          dtype: DECIMAL(19, 4)
          nullable: true
      constraints:
      - pk_fact_closed_deals:
          type: PRIMARY KEY
          columns:
          - mql_id
      # - fk_fact_closed_deals_fact_marketing_qualified_leads__mql_id:
      #     type: FOREIGN KEY
      #     column: mql_id
      #     references:
      #       fact_marketing_qualified_leads:
      #         schema: marketing
      #         column: mql_id

- logistics:

  - dim_geolocation:
      filename: olist_geolocation_dataset.csv
      type: dim
      columns:
      - geolocation_sk:
          dtype: INT
          nullable: false
          sk:
            seed: 1
            increment: 1
      - geolocation_zip_code_prefix:
          dtype: CHAR(5)
          nullable: false
      - geolocation_lat:
          dtype: DECIMAL(9, 6)
          nullable: true
      - geolocation_lng:
          dtype: DECIMAL(9, 6)
          nullable: true
      - geolocation_city:
          dtype: NVARCHAR(40)
          nullable: true
      - geolocation_state:
          dtype: CHAR(2)
          nullable: true
      constraints:
      - pk_dim_geolocation:
          type: PRIMARY KEY
          columns:
          - geolocation_sk
    #   - uq_dim_geolocation_zip_lat_lng:
    #       type: UNIQUE
    #       columns:
    #       - geolocation_zip_code_prefix
    #       - geolocation_lat
    #       - geolocation_lng
